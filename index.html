
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子错题本 - 智能复习助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#93CA76',
                        secondary: '#4A90E2',
                        accent: '#F5A623',
                        background: '#F8FAFC',
                        brandText: '#1F2937',
                        brandBorder: '#EEF2F7',
                        blue: '#4A90E2',
                        teal: '#4DB6AC',
                        orange: '#F5A623',
                        red: '#EF4444',
                        dark: '#1F2937'
                    },
                    boxShadow: {
                        'soft': '0 2px 12px rgba(0, 0, 0, 0.03)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.05)',
                        'tabbar': '0 -10px 40px rgba(0, 0, 0, 0.03)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --status-bar-height: 44px;
            --safe-area-bottom: 34px;
            --tab-bar-height: 64px;
        }
        body {
            background-color: #cbd5e1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s ease;
        }
        #root {
            width: 390px;
            height: 844px;
            position: relative;
            background: #F8FAFC;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 8px solid #1a1a1a;
            border-radius: 54px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        #root.dark {
            background: #121212;
            border-color: #2a2a2a;
        }
        @media (max-width: 450px) {
            body { background-color: #fff; }
            #root {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
            }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: var(--safe-area-bottom); }
        .safe-top { padding-top: var(--status-bar-height); }
        
        .status-bar {
            height: var(--status-bar-height);
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            background: transparent;
            z-index: 100;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            transition: color 0.3s ease;
        }
        .dark .status-bar {
            color: #fff;
        }
        
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 5px;
            background: #000;
            border-radius: 100px;
            z-index: 200;
            opacity: 0.15;
            pointer-events: none;
            transition: background-color 0.3s ease;
        }
        .dark .home-indicator {
            background: #fff;
            opacity: 0.3;
        }
        
        #app-viewport {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .animate-fadeIn {
          animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div class="status-bar">
            <span>9:41</span>
            <div class="flex gap-1.5 items-center">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M0 10h2v2H0v-2zm3-3h2v5H3V7zm3-3h2v8H6V4zm3-3h2v11H9V1z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                <div class="w-6 h-3 border border-current rounded-sm relative ml-1"><div class="absolute inset-0.5 bg-current rounded-sm w-3/4"></div></div>
            </div>
        </div>
        <div id="app-viewport"></div>
        <div class="home-indicator"></div>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
